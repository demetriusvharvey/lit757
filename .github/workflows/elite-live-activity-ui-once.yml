name: Elite live activity UI once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elite-live-activity-ui-once.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Transform Buzz into a live-activity-first experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx_path = Path("app/buzz-map-app.tsx")
          css_path = Path("app/buzz-map-app.css")
          tsx = tsx_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          replacements = [
            (
              '<strong>BUZZ</strong><span>THINGS TO DO NOW</span>',
              '<strong>BUZZ</strong><span>LIVE ACTIVITY</span>',
            ),
            (
              '<span><List /> Top Buzz</span>',
              '<span><List /> Buzzing now</span>',
            ),
            (
              '<div><small>HIGHEST BUZZ FIRST</small><h1>{active === "All" ? "Places buzzing now" : active}</h1><p>{loading ? "Updating activity…" : `${filtered.length} places ${scopeLabel}`}</p></div>',
              '<div><small>LIVE CITY PULSE</small><h1>{active === "All" ? "Buzzing right now" : active}</h1><p>{loading ? "Reading the city…" : `Fresh activity across ${scopeLabel}`}</p></div>',
            ),
            (
              '<span className="buzz-heat-key"><i /> Heat map <b>→</b> logo pins</span>',
              '<span className="buzz-heat-key"><i /> Live pulse</span>',
            ),
            (
              '{mapZoom < 9.8 ? <><Sparkles /><span>Area heat</span><small>Tap a hot zone or zoom in for venues</small></> : mapZoom < 12.6 ? <><Sparkles /><span>Heat hubs</span><small>Tap a glow to reveal its venues</small></> : <><MapPin /><span>Logo pins</span><small>Thick rings show each place’s Buzz</small></>}',
              '{mapZoom < 9.8 ? <><Sparkles /><span>City pulse</span><small>Live energy across Hampton Roads</small></> : mapZoom < 12.6 ? <><Sparkles /><span>Buzzing zones</span><small>Tap a pulse to reveal what is moving</small></> : <><MapPin /><span>Live places</span><small>Tap a place to see what is happening</small></>}',
            ),
            (
              '          [">=", ["coalesce", ["get", "maxScore"], 40], 90], "ON FIRE",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 78], "HOT",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 60], "RISING",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 45], "ACTIVE",\n          "EXPLORE",',
              '          [">=", ["coalesce", ["get", "maxScore"], 40], 90], "ON FIRE",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 78], "BUZZING",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 60], "HEATING UP",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 45], "ACTIVE",\n          "CHILL",',
            ),
            (
              '        "circle-radius": ["step", ["get", "point_count"], 25, 8, 31, 20, 38],',
              '        "circle-radius": ["step", ["get", "point_count"], 22, 8, 27, 20, 33],',
            ),
            (
              '        "circle-radius": ["step", ["get", "point_count"], 17, 8, 21, 20, 27],',
              '        "circle-radius": ["step", ["get", "point_count"], 14, 8, 18, 20, 22],',
            ),
            (
              '        "circle-stroke-width": 4,',
              '        "circle-stroke-width": 3,',
            ),
            (
              '        "text-size": ["step", ["get", "point_count"], 8, 10, 8.5, 25, 9],',
              '        "text-size": ["step", ["get", "point_count"], 8.5, 10, 9, 25, 9.5],',
            ),
            (
              '        "heatmap-intensity": ["interpolate", ["linear"], ["zoom"], 4, 0.5, 9, 1.05, 11.8, 1.8],',
              '        "heatmap-intensity": ["interpolate", ["linear"], ["zoom"], 4, 0.72, 9, 1.38, 11.8, 2.15],',
            ),
            (
              '        "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 4, 18, 8, 32, 11.8, 58],',
              '        "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 4, 22, 8, 39, 11.8, 68],',
            ),
          ]

          missing = []
          for before, after in replacements:
            if before not in tsx:
              missing.append(before[:90])
            else:
              tsx = tsx.replace(before, after, 1)

          if missing:
            raise SystemExit("Expected UI snippets were not found: " + " | ".join(missing))

          elite_css = r'''

/* Elite live-activity interface */
.buzz-map-app{grid-template-rows:56px 48px minmax(0,1fr);background:#05070a}
.buzz-map-header{grid-template-columns:180px minmax(260px,580px) 1fr;padding:0 18px;border-bottom-color:rgba(255,255,255,.08);background:rgba(5,7,10,.92)}
.buzz-map-brand strong{font-size:28px;letter-spacing:-.07em}
.buzz-map-brand span{color:#a8b0bb;font-size:7px;letter-spacing:.22em}
.buzz-map-search{height:38px;border-color:rgba(255,255,255,.12);border-radius:999px;background:rgba(18,23,31,.86);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.buzz-map-header-actions button{height:36px;border-color:rgba(255,255,255,.1);background:rgba(15,20,27,.82)}
.buzz-map-filters{padding:6px 14px;border-bottom-color:rgba(255,255,255,.07);background:rgba(7,10,14,.94)}
.buzz-map-filters button{height:35px;padding:0 14px;border-color:rgba(255,255,255,.1);background:rgba(15,20,27,.72);font-size:10px}
.buzz-map-filters button.active{border-color:rgba(255,255,255,.92);background:#f8fafc;color:#07090c;box-shadow:0 8px 24px rgba(0,0,0,.24)}
.buzz-map-layout{grid-template-columns:330px minmax(0,1fr)}
.buzz-map-list{border-right-color:rgba(255,255,255,.08);background:rgba(6,9,13,.97)}
.buzz-map-list-head{padding:16px 15px 12px;border-bottom-color:rgba(255,255,255,.07)}
.buzz-map-list-head small{color:#fb923c;letter-spacing:.18em}
.buzz-map-list-head h1{font-size:22px}
.buzz-heat-key{padding:6px 8px;border:1px solid rgba(251,146,60,.28);border-radius:999px;background:rgba(251,146,60,.08);color:#fed7aa}
.buzz-heat-key i{background:#fb923c;box-shadow:0 0 16px rgba(251,146,60,.9)}
.buzz-map-list-scroll{padding:8px 9px 18px}
.buzz-map-list-scroll article{grid-template-columns:64px minmax(0,1fr) 30px;min-height:84px;padding:8px;border-color:rgba(255,255,255,.08);border-radius:16px;background:rgba(14,19,26,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.buzz-map-list-scroll article:hover,.buzz-map-list-scroll article.selected{border-color:rgba(251,146,60,.55);background:rgba(20,26,35,.96);transform:none}
.buzz-list-photo{border-radius:13px;background:#101720}
.buzz-list-photo b{display:none}
.buzz-list-copy>strong{font-size:14px}
.buzz-list-copy>p{color:#99a3af}
.buzz-status{display:none}
.buzz-vibe-tag{margin-top:6px;padding:4px 8px;border-color:rgba(255,255,255,.13);background:rgba(255,255,255,.035);font-size:7px}
.buzz-vibe-tag.live{border-color:rgba(251,146,60,.6);background:rgba(251,146,60,.12);color:#ffedd5}
.buzz-map-stage{background:#05070a}
.buzz-map-toolbar{top:12px;left:12px}
.buzz-map-toolbar button{height:36px;border-color:rgba(255,255,255,.12);border-radius:999px;background:rgba(6,9,13,.86);box-shadow:0 12px 35px rgba(0,0,0,.34)}
.buzz-map-mode{top:12px;padding:8px 11px;border-color:rgba(251,146,60,.28);border-radius:999px;background:rgba(6,9,13,.86);box-shadow:0 12px 35px rgba(0,0,0,.32)}
.buzz-map-mode svg{color:#fb923c}
.buzz-map-mode span{font-size:8px;letter-spacing:.16em}
.buzz-map-mode small{color:#a1aab5}
.buzz-map-loading,.buzz-map-error{border-color:rgba(255,255,255,.12);background:rgba(6,9,13,.9)}
.buzz-map-loading i{background:#fb923c;box-shadow:0 0 16px #fb923c}
.buzz-venue-detail{border-color:rgba(255,255,255,.12);background:#0a0e14;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.buzz-detail-photo:after{background:linear-gradient(transparent,#0a0e14)}

@media(max-width:900px){
  .buzz-map-app{grid-template-rows:52px 46px minmax(0,1fr)}
  .buzz-map-header{padding:0 9px;gap:8px}
  .buzz-map-brand strong{font-size:24px}
  .buzz-map-search{height:36px}
  .buzz-map-filters{padding:5px 8px}
  .buzz-map-filters button{height:34px;padding:0 11px}
  .buzz-map-list{left:10px;right:10px;bottom:10px;height:132px;border-color:rgba(255,255,255,.12);border-radius:22px;background:rgba(7,10,14,.91);box-shadow:0 24px 70px rgba(0,0,0,.62);backdrop-filter:blur(22px)}
  .buzz-mobile-list-handle{height:36px;border-bottom-color:rgba(255,255,255,.08)}
  .buzz-mobile-list-handle span{font-size:9px;letter-spacing:.04em}
  .buzz-map-list-scroll{padding:6px}
  .buzz-map-list:not(.expanded) .buzz-map-list-scroll article{flex-basis:calc(100vw - 34px);min-height:82px}
  .buzz-map-list-scroll article{grid-template-columns:60px minmax(0,1fr) 28px;min-height:80px;border-radius:15px}
  .buzz-list-copy>small{font-size:7px}
  .buzz-list-copy>strong{font-size:13px}
  .buzz-list-copy>p{margin:4px 0;font-size:8px}
  .buzz-map-mode{top:10px;right:10px;padding:8px 10px}
  .buzz-map-toolbar{top:10px;left:10px}
  .buzz-map-loading,.buzz-map-error{bottom:150px}
}

@media(max-width:480px){
  .buzz-map-app{grid-template-rows:50px 44px minmax(0,1fr)}
  .buzz-map-brand strong{font-size:23px}
  .buzz-map-search input{font-size:10px}
  .buzz-map-filters button{height:32px;font-size:8px}
  .buzz-map-mode span{font-size:7px}
  .buzz-map-list{height:128px}
}
'''

          if "/* Elite live-activity interface */" not in css:
            css += elite_css

          tsx_path.write_text(tsx, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run product tests
        run: npx --yes tsx@4.20.6 --test src/lib/invite-the-crew.test.ts src/lib/adaptive-discovery.test.ts src/lib/buzz/*.test.ts

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: build-placeholder

      - name: Commit transformed UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx app/buzz-map-app.css
          git commit -m "Rebuild Buzz around live city activity"
          git push origin main
