name: Patch museum gate

on:
  push:
    branches: [chore/require-museum-source]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/require-museum-source
          fetch-depth: 0
      - name: Require museum coverage independently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/public-data-smoke.yml')
          text = path.read_text()
          old = '''          assert (
              int((institution_kinds.get("museum") or {}).get("successful") or 0)
              + int((institution_kinds.get("festival") or {}).get("successful") or 0)
              + int((institution_kinds.get("attraction") or {}).get("successful") or 0)
          ) > 0, "No museum, festival, or attraction calendar is working"'''
          new = '''          assert int((institution_kinds.get("museum") or {}).get("successful") or 0) > 0, "No museum calendar is working"
          assert (
              int((institution_kinds.get("festival") or {}).get("successful") or 0)
              + int((institution_kinds.get("attraction") or {}).get("successful") or 0)
          ) > 0, "No festival or attraction calendar is working"'''
          if old not in text:
              raise SystemExit('Institution kind assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/public-data-smoke.yml
          git commit -m "Require a working museum calendar"
          git push origin HEAD:chore/require-museum-source
