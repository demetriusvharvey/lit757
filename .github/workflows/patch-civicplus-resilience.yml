name: Patch CivicPlus resilience

on:
  push:
    branches: [docs/osm-production-validation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/osm-production-validation
          fetch-depth: 0
      - name: Serialize city hosts and retry transient failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/events/civicplus-calendars.ts')
          text = path.read_text()
          text = text.replace(
              'const REQUEST_TIMEOUT_MS = 12_000;\nconst FETCH_CONCURRENCY = 6;',
              'const REQUEST_TIMEOUT_MS = 12_000;\nconst FETCH_ATTEMPTS = 2;\nconst HOST_CONCURRENCY = 4;\nconst BETWEEN_FEEDS_MS = 200;',
              1,
          )
          start = text.index('async function fetchCalendarText(feed: CivicPlusCalendarFeed) {')
          end = text.index('\nasync function mapLimit', start)
          replacement = '''async function wait(milliseconds: number) {
            await new Promise(resolve => setTimeout(resolve, milliseconds));
          }

          async function fetchCalendarText(feed: CivicPlusCalendarFeed) {
            const failures: string[] = [];
            for (let attempt = 1; attempt <= FETCH_ATTEMPTS; attempt += 1) {
              try {
                const response = await fetch(feed.url, {
                  cache: "no-store",
                  headers: {
                    Accept: "text/calendar,text/plain;q=0.9,*/*;q=0.5",
                    "User-Agent": "Buzz/1.0 (https://lit757.vercel.app; demetriusvharvey@gmail.com)",
                  },
                  signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
                });
                if (!response.ok) throw new Error(`Official calendar request failed (${response.status})`);
                const calendarText = await response.text();
                if (!calendarText.includes("BEGIN:VCALENDAR") && !calendarText.includes("BEGIN:VEVENT")) {
                  throw new Error("Official calendar did not return iCalendar content");
                }
                return calendarText;
              } catch (error) {
                failures.push(error instanceof Error ? error.message : "Calendar request failed");
                if (attempt < FETCH_ATTEMPTS) await wait(500 * attempt);
              }
            }
            throw new Error(`Official calendar failed after ${FETCH_ATTEMPTS} attempts: ${failures.join(" | ")}`);
          }
          '''
          text = text[:start] + replacement + text[end:]

          anchor = 'export async function fetchAllCivicPlusCalendars(\n'
          helper = '''export function groupCivicPlusFeedsByOrigin(feeds: CivicPlusCalendarFeed[]) {
            const groups = new Map<string, CivicPlusCalendarFeed[]>();
            for (const feed of feeds) {
              const origin = new URL(feed.url).origin;
              groups.set(origin, [...(groups.get(origin) || []), feed]);
            }
            return [...groups.values()];
          }

          async function fetchFeedGroup(feeds: CivicPlusCalendarFeed[]) {
            const results: CivicPlusFeedResult[] = [];
            let consecutiveFailures = 0;
            for (let index = 0; index < feeds.length; index += 1) {
              const result = await fetchCivicPlusFeed(feeds[index]);
              results.push(result);
              consecutiveFailures = result.status === "error" ? consecutiveFailures + 1 : 0;
              if (consecutiveFailures >= 2) {
                for (const skipped of feeds.slice(index + 1)) {
                  results.push({
                    feed: skipped,
                    status: "error",
                    events: [],
                    error: "Skipped after repeated failures from the same official calendar host",
                    fetchedAt: new Date().toISOString(),
                  });
                }
                break;
              }
              if (index < feeds.length - 1) await wait(BETWEEN_FEEDS_MS);
            }
            return results;
          }

          '''
          if 'export function groupCivicPlusFeedsByOrigin' not in text:
              text = text.replace(anchor, helper + anchor, 1)
          old_results = '  const results = await mapLimit(feeds, FETCH_CONCURRENCY, fetchCivicPlusFeed);'
          new_results = '''  const groups = groupCivicPlusFeedsByOrigin(feeds);
            const results = (await mapLimit(groups, HOST_CONCURRENCY, fetchFeedGroup)).flat();'''
          if old_results in text:
              text = text.replace(old_results, new_results, 1)
          elif 'groupCivicPlusFeedsByOrigin(feeds)' not in text:
              raise SystemExit('CivicPlus fetch-all anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/civicplus-calendars.ts
          git commit -m "Harden CivicPlus feeds against host throttling"
          git push origin HEAD:docs/osm-production-validation
