name: City calendar sync

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ingest Hampton Roads city and institution calendars
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${BASE_URL:?Add BUZZ_PRODUCTION_URL as a GitHub Actions secret}"
          : "${CRON_SECRET:?Add CRON_SECRET as a GitHub Actions secret}"
          BASE_URL="${BASE_URL%/}"

          echo "Syncing Virginia Beach official calendar"
          curl --silent --show-error --fail-with-body --retry 2 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/events/city-calendars"

          echo
          echo "Syncing Norfolk, Chesapeake, Portsmouth, Hampton, Newport News, and Suffolk calendars"
          curl --silent --show-error --fail-with-body --retry 2 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/events/civicplus-calendars"

          echo
          echo "Syncing universities, arenas, arts centers, museums, attractions, and festivals"
          curl --silent --show-error --fail-with-body --retry 2 --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/events/institution-calendars"

          echo
          echo "Syncing verified local promoter ticket pages"
          curl --silent --show-error --fail-with-body --retry 2 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/events/promoter-calendars"
