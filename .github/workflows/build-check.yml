name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test city calendar ingestion
        id: city_calendar_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes tsx@4.20.6 --test src/lib/events/city-calendars.test.ts 2>&1 | tee city-calendar-test.log
      - name: Test weather and transit integrations
        id: public_data_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes tsx@4.20.6 --test src/lib/integrations/*.test.ts 2>&1 | tee public-data-test.log
      - name: Build
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: build-placeholder
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            city-calendar-test.log
            public-data-test.log
            production-build.log
          retention-days: 1
      - name: Fail when validation fails
        if: steps.city_calendar_tests.outcome == 'failure' || steps.public_data_tests.outcome == 'failure' || steps.production_build.outcome == 'failure'
        run: exit 1
