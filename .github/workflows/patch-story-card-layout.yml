name: Patch Story card layout

on:
  push:
    branches: [feature/invite-the-crew]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invite-the-crew
          fetch-depth: 0
      - name: Satisfy ImageResponse layout rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/share/venue-card/route.tsx')
          text = path.read_text()
          old = '<div style={{ marginTop: 16, fontSize: 28, color: "#cbd5e1" }}>{city} · {trend}</div>'
          new = '<div style={{ display: "flex", marginTop: 16, fontSize: 28, color: "#cbd5e1" }}>{city} · {trend}</div>'
          if old not in text:
              raise SystemExit('City/trend layout anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-story-card-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/share/venue-card/route.tsx .github/workflows/patch-story-card-layout.yml
          git commit -m "Fix Story card image layout"
          git push origin HEAD:feature/invite-the-crew