name: Centralize venue images

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/centralize-venue-images
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: node scripts/patch-venue-image-consumers.mjs
      - run: npm ci
      - run: npm run lint

      - name: Commit migrated consumers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/discover/route.ts app/api/me/likes/route.ts app/api/nearby/route.ts app/account-panel.tsx
          if git diff --cached --quiet; then
            echo "No consumer changes required."
            exit 0
          fi
          git commit -m "Route all venue cards through shared image resolver"
          git push origin HEAD:fix/centralize-venue-images
