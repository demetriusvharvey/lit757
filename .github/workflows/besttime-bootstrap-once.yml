name: BestTime trial bootstrap once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/besttime-bootstrap-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Bootstrap 25 BestTime venues
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export RUN_URL

          if [ -z "${BASE_URL:-}" ]; then
            printf '## BestTime trial activation failed\n\nGitHub secret `BUZZ_PRODUCTION_URL` is missing.\n\n[Open workflow run](%s)\n' "$RUN_URL" > besttime-bootstrap-summary.md
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            printf '## BestTime trial activation failed\n\nGitHub secret `CRON_SECRET` is missing.\n\n[Open workflow run](%s)\n' "$RUN_URL" > besttime-bootstrap-summary.md
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 300 \
            --output besttime-bootstrap.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/buzz/refresh?provider=besttime&action=bootstrap&limit=25")
          CURL_STATUS=$?
          export HTTP_STATUS CURL_STATUS

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_url = os.environ.get("RUN_URL", "")
          http_status = os.environ.get("HTTP_STATUS", "unknown")
          curl_status = int(os.environ.get("CURL_STATUS", "1"))
          payload_path = Path("besttime-bootstrap.json")
          payload = None
          parse_error = None

          if payload_path.exists():
              try:
                  payload = json.loads(payload_path.read_text(encoding="utf-8"))
              except Exception as error:
                  parse_error = str(error)

          failure = None
          if curl_status != 0:
              failure = f"The protected production endpoint could not be reached (curl status {curl_status})."
          elif http_status != "200":
              failure = f"The protected production endpoint returned HTTP {http_status}."
          elif parse_error:
              failure = f"The production response was not valid JSON: {parse_error}"
          elif not isinstance(payload, dict) or payload.get("success") is not True:
              failure = f"The production endpoint reported failure: {str((payload or {}).get('error') or 'unknown error')[:500]}"

          result = None
          if not failure:
              results = payload.get("results") or []
              result = next((item for item in results if item.get("provider") == "besttime"), None)
              if result is None:
                  failure = "The production response did not include a BestTime provider result."

          details = (result or {}).get("details") or []
          attempted = int((result or {}).get("attempted") or 0)
          succeeded = int((result or {}).get("succeeded") or 0)
          failed = int((result or {}).get("failed") or 0)
          skipped = [item for item in details if item.get("status") == "skipped"]

          if not failure and skipped:
              reason = str(skipped[0].get("error") or "BestTime was skipped")[:500]
              failure = f"BestTime was skipped by production: {reason}"
          if not failure and attempted <= 0:
              failure = "BestTime found no eligible venues with usable addresses."
          if not failure and succeeded <= 0:
              sample = next((str(item.get("error")) for item in details if item.get("error")), "No provider error was returned")
              failure = f"BestTime mapped no venues successfully. First provider error: {sample[:500]}"

          coverage = {}
          for item in details:
              status = str(item.get("status") or "unknown")
              coverage[status] = coverage.get(status, 0) + 1

          if failure:
              lines = [
                  "## BestTime trial activation failed",
                  "",
                  failure,
                  "",
                  f"- Attempted: **{attempted}**",
                  f"- Successful mappings: **{succeeded}**",
                  f"- Failed: **{failed}**",
                  "",
                  f"[Open workflow run]({run_url})",
              ]
              Path("besttime-bootstrap-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(1)

          lines = [
              "## BestTime trial activation completed",
              "",
              f"- Attempted: **{attempted}**",
              f"- Successful mappings: **{succeeded}**",
              f"- Failed: **{failed}**",
              "- Bootstrap limit: **25 venues**",
              "",
              "### Coverage returned",
          ]
          for status, count in sorted(coverage.items()):
              lines.append(f"- `{status}`: **{count}**")
          lines.extend([
              "",
              "BestTime evidence was stored server-side and affected venue scores were recomputed. No API key is included in the issue comment or workflow artifact.",
              "",
              f"[Open workflow run]({run_url})",
          ])
          Path("besttime-bootstrap-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps({"attempted": attempted, "succeeded": succeeded, "failed": failed, "coverage": coverage}, indent=2))
          PY

      - name: Record activation result on integration issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f besttime-bootstrap-summary.md ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '## BestTime trial activation failed\n\nThe workflow stopped before it could produce a provider summary.\n\n[Open workflow run](%s)\n' "$RUN_URL" > besttime-bootstrap-summary.md
          fi
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body-file besttime-bootstrap-summary.md

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: besttime-trial-bootstrap-${{ github.run_id }}
          path: |
            besttime-bootstrap.json
            besttime-bootstrap-summary.md
          if-no-files-found: warn
          retention-days: 7
