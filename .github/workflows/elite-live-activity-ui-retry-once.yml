name: Elite live activity UI retry once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elite-live-activity-ui-retry-once.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse the audited transformation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/elite-live-activity-ui-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/elite-ui-transform.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/elite-ui-transform.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run product tests
        run: npx --yes tsx@4.20.6 --test src/lib/invite-the-crew.test.ts src/lib/adaptive-discovery.test.ts src/lib/buzz/*.test.ts

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: build-placeholder

      - name: Commit transformed UI on latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx app/buzz-map-app.css
          git commit -m "Rebuild Buzz around live city activity"
          git pull --rebase origin main
          git push origin main
