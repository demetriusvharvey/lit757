name: Center Story surge marker

on:
  push:
    branches: [feature/invite-the-crew]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invite-the-crew
          fetch-depth: 0
      - name: Center heat target in the mini map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/share/venue-card/route.tsx')
          text = path.read_text()
          old = '<div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>'
          new = '<div style={{ position: "absolute", left: 0, top: 0, width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center" }}>'
          if old not in text:
              raise SystemExit('Heat target wrapper not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/center-story-surge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/share/venue-card/route.tsx .github/workflows/center-story-surge.yml
          git commit -m "Center the Story card surge marker"
          git push origin HEAD:feature/invite-the-crew