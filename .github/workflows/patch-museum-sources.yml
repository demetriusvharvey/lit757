name: Patch museum sources

on:
  push:
    branches: [feature/museum-calendars]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/museum-calendars
          fetch-depth: 0
      - name: Add official museum event sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/events/institution-calendars.ts')
          text = path.read_text()
          anchor = '''  {
              id: "portsmouth_museums_official",'''
          insertion = '''  {
              id: "chrysler_museum_official",
              name: "Chrysler Museum of Art Events",
              kind: "museum",
              city: "Norfolk",
              url: "https://chrysler.org/events/",
              format: "tribe-api",
              enabled: true,
              venueName: "Chrysler Museum of Art",
            },
            {
              id: "mariners_museum_official",
              name: "The Mariners' Museum and Park Events",
              kind: "museum",
              city: "Newport News",
              url: "https://www.marinersmuseum.org/events/",
              format: "tribe-api",
              enabled: true,
              venueName: "The Mariners' Museum and Park",
            },
          '''
          if 'id: "chrysler_museum_official"' not in text:
              if anchor not in text:
                  raise SystemExit('Portsmouth museum source anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/institution-calendars.ts
          git commit -m "Add Chrysler and Mariners museum calendars"
          git push origin HEAD:feature/museum-calendars
