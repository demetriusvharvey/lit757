name: Fix mobile map pin clicks

on:
  push:
    paths:
      - .github/workflows/fix-mobile-map-pin-clicks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Mapbox click handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/mobile-home.tsx")
          text = path.read_text()

          old = '''        map.on("click","mobile-venue-pins",e=>{const feature=e.features?.[0];const index=Number(feature?.properties?.index);const venue=mapped[index];if(venue){setSelected(venue);setDetailsOpen(true);map.easeTo({center:coords(venue),zoom:Math.max(map.getZoom(),13),duration:550});}});'''
          new = '''        const openMapVenue=(feature?:mapboxgl.MapboxGeoJSONFeature)=>{const venueId=String(feature?.properties?.id||"");const venue=mapped.find(item=>String(item.id)===venueId);if(!venue)return;setSelected(venue);setDetailsOpen(true);map.easeTo({center:coords(venue),zoom:Math.max(map.getZoom(),13),duration:550});};
          map.on("click","mobile-live-dot",e=>openMapVenue(e.features?.[0]));
          map.on("click","mobile-venue-pins",e=>openMapVenue(e.features?.[0]));
          ["mobile-live-dot","mobile-venue-pins"].forEach(layer=>{map.on("mouseenter",layer,()=>{map.getCanvas().style.cursor="pointer";});map.on("mouseleave",layer,()=>{map.getCanvas().style.cursor="";});});'''

          if old not in text:
              raise SystemExit("Expected venue pin handler was not found")

          path.write_text(text.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile-home.tsx
          git commit -m "fix: open venue details from every visible map dot"
          git push
