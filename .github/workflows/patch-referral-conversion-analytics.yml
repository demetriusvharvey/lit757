name: Patch referral conversion analytics

on:
  push:
    branches: [feature/referral-conversion-analytics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/referral-conversion-analytics
          fetch-depth: 0
      - name: Instrument referral funnel
        run: python scripts/patch-referral-conversion-analytics.py
      - name: Commit generated UI instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Track Buzz referral and conversion funnel"
          git push origin HEAD:feature/referral-conversion-analytics
