name: Apply Buzz source fix

on:
  push:
    branches:
      - feat/buzz-ui-ux-overhaul
    paths:
      - .github/workflows/apply-buzz-source-fix.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/buzz-ui-ux-overhaul
      - name: Normalize Mapbox callback typing
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('app/buzz-mobile-home.tsx')
          text = mobile.read_text()
          old = 'const onMoveStart = (event: mapboxgl.MapboxEvent<MouseEvent | TouchEvent | WheelEvent | undefined>) => {'
          new = 'const onMoveStart = (event: { originalEvent?: unknown }) => {'
          if old not in text:
              raise SystemExit('mobile Mapbox event signature was not found')
          mobile.write_text(text.replace(old, new, 1))

          desktop = Path('app/buzz-desktop-home.tsx')
          text = desktop.read_text()
          old = '''      if (clusterId == null || feature?.geometry.type !== "Point") return;
      (map.getSource("buzz-desktop-venues") as mapboxgl.GeoJSONSource).getClusterExpansionZoom(clusterId, (clusterError, zoom) => {
        if (!clusterError && zoom != null) map.easeTo({ center: feature.geometry.coordinates as [number, number], zoom, duration: 460 });
      });'''
          new = '''      if (clusterId == null || feature?.geometry.type !== "Point") return;
      const center = feature.geometry.coordinates as [number, number];
      (map.getSource("buzz-desktop-venues") as mapboxgl.GeoJSONSource).getClusterExpansionZoom(clusterId, (clusterError, zoom) => {
        if (!clusterError && zoom != null) map.easeTo({ center, zoom, duration: 460 });
      });'''
          if old not in text:
              raise SystemExit('desktop cluster callback was not found')
          desktop.write_text(text.replace(old, new, 1))
          PY
      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-mobile-home.tsx app/buzz-desktop-home.tsx
          git commit -m "Fix Mapbox callback typing in Buzz UI"
          git push origin HEAD:feat/buzz-ui-ux-overhaul
