name: First OSM production enrichment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply audited OpenStreetMap matches
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_URL:?Add BUZZ_PRODUCTION_URL as a GitHub Actions secret}"
          : "${CRON_SECRET:?Add CRON_SECRET as a GitHub Actions secret}"
          BASE_URL="${BASE_URL%/}"
          curl --silent --show-error --fail-with-body --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/venues/osm-enrich?limit=350" \
            | tee osm-first-enrichment-output.json
      - name: Upload enrichment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-first-enrichment-output
          path: osm-first-enrichment-output.json
          if-no-files-found: warn
          retention-days: 3
