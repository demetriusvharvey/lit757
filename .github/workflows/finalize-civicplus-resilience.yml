name: Finalize CivicPlus resilience

on:
  push:
    branches: [docs/osm-production-validation]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/osm-production-validation
          fetch-depth: 0
      - name: Collapse helpers and add host grouping regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('src/lib/events/civicplus-calendars.ts')
          text = source.read_text()
          pattern = r'(?:async function wait\(milliseconds: number\) \{\n  await new Promise\(resolve => setTimeout\(resolve, milliseconds\)\);\n\}\n\n)+'
          replacement = 'async function wait(milliseconds: number) {\n  await new Promise(resolve => setTimeout(resolve, milliseconds));\n}\n\n'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Wait helper block not found')
          source.write_text(text)

          test = Path('tests/city-calendar-ingestion.test.mjs')
          existing = test.read_text()
          if 'groups CivicPlus feeds by host' not in existing:
              existing += '''\n\ntest("groups CivicPlus feeds by host", async () => {\n  const module = await import("../src/lib/events/civicplus-calendars.ts");\n  const feeds = [\n    { feedId: "a", city: "Norfolk", citySourceId: "n", citySourceName: "N", category: "A", url: "https://www.norfolk.gov/a", enabled: true },\n    { feedId: "b", city: "Norfolk", citySourceId: "n", citySourceName: "N", category: "B", url: "https://www.norfolk.gov/b", enabled: true },\n    { feedId: "c", city: "Hampton", citySourceId: "h", citySourceName: "H", category: "C", url: "https://www.hampton.gov/c", enabled: true },\n  ];\n  const groups = module.groupCivicPlusFeedsByOrigin(feeds);\n  assert.equal(groups.length, 2);\n  assert.deepEqual(groups.map(group => group.length).sort(), [1, 2]);\n});\n'''
              test.write_text(existing)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/civicplus-calendars.ts tests/city-calendar-ingestion.test.mjs
          git commit -m "Finalize CivicPlus host resilience"
          git push origin HEAD:docs/osm-production-validation