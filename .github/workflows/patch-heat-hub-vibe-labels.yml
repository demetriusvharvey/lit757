name: Patch Heat Hub vibe labels

on:
  push:
    branches: [feature/heat-hub-vibe-labels]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heat-hub-vibe-labels
          fetch-depth: 0
      - name: Replace raw cluster counts with vibe labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/buzz-map-app.tsx')
          text = path.read_text()

          replacements = {
            'clusterRadius: 64,': 'clusterRadius: 54,',
            '"circle-radius": ["step", ["get", "point_count"], 28, 8, 38, 20, 50],': '"circle-radius": ["step", ["get", "point_count"], 25, 8, 31, 20, 38],',
            '"circle-radius": ["step", ["get", "point_count"], 20, 8, 27, 20, 35],': '"circle-radius": ["step", ["get", "point_count"], 17, 8, 21, 20, 27],',
            'id: "buzz-heat-hub-count",': 'id: "buzz-heat-hub-vibe",',
            '"text-field": ["concat", ["get", "point_count_abbreviated"], " SPOTS"],\n        "text-size": ["step", ["get", "point_count"], 9, 10, 10, 25, 11],': '"text-field": [\n          "case",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 90], "ON FIRE",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 78], "HOT",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 60], "RISING",\n          [">=", ["coalesce", ["get", "maxScore"], 40], 45], "ACTIVE",\n          "EXPLORE",\n        ],\n        "text-size": ["step", ["get", "point_count"], 8, 10, 8.5, 25, 9],',
            '"text-halo-width": 1,': '"text-halo-width": 1.35,',
            '<><Sparkles /><span>Heat hubs</span><small>Tap a hub to reveal its venues</small></>': '<><Sparkles /><span>Heat hubs</span><small>Tap a glow to reveal its venues</small></>',
          }

          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing source anchor: {old}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx
          git commit -m "Replace Heat Hub counts with vibe labels"
          git push origin HEAD:feature/heat-hub-vibe-labels
