name: Tourism production smoke

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourism-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Visit Hampton source adapter
        shell: bash
        run: |
          npx --yes tsx@4.20.6 -e '
            import { INSTITUTION_CALENDAR_SOURCES, fetchInstitutionSource } from "./src/lib/events/institution-calendars.ts";
            (async () => {
              const source = INSTITUTION_CALENDAR_SOURCES.find(item => item.id === "visit_hampton_official");
              if (!source) throw new Error("Visit Hampton source is missing from the registry");
              const result = await fetchInstitutionSource(source);
              console.log(JSON.stringify({ source: result.source, status: result.status, eventCount: result.events.length, error: result.error }, null, 2));
              if (result.status !== "ok") throw new Error(result.error || "Visit Hampton source failed");
              if (result.events.length <= 0) throw new Error("Visit Hampton returned no events");
            })();
          '
      - name: Verify official tourism production sources
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          REQUIRE_VISIT_HAMPTON: "true"
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_URL:?Add BUZZ_PRODUCTION_URL as a GitHub Actions secret}"
          BASE_URL="${BASE_URL%/}"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          require_visit_hampton = os.environ.get("REQUIRE_VISIT_HAMPTON", "false").lower() == "true"
          path = "/api/data/institution-calendars?tourismProbe=1"
          request = urllib.request.Request(
              f"{base}{path}",
              headers={
                  "User-Agent": "BuzzTourismProductionSmoke/1.0",
                  "Accept": "application/json",
              },
          )
          report = {}
          try:
              response = urllib.request.urlopen(request, timeout=180)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              report = {"httpStatus": error.code, "body": body[:30000]}
              with open("tourism-production-smoke-output.json", "w", encoding="utf-8") as output:
                  json.dump(report, output, indent=2)
              raise AssertionError(f"Tourism endpoint returned HTTP {error.code}: {body[:4000]}") from error
          with response:
              payload = json.load(response)
          report = payload
          with open("tourism-production-smoke-output.json", "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2)

          assert response.status == 200, response.status
          assert payload.get("success") is True, json.dumps(payload)[:4000]
          by_kind = payload.get("byKind") or {}
          tourism = by_kind.get("tourism") or {}
          assert int(tourism.get("registered") or 0) >= 2, "VisitNorfolk and Visit Hampton must both be registered"
          assert int(tourism.get("successful") or 0) >= 2, "VisitNorfolk and Visit Hampton must both be healthy"
          assert int(tourism.get("events") or 0) > 0, "Tourism sources returned no events"

          sources = payload.get("sources") or []
          visit_norfolk = next((source for source in sources if source.get("id") == "visit_norfolk_official"), None)
          assert visit_norfolk is not None, "VisitNorfolk source is missing"
          assert visit_norfolk.get("status") == "ok", json.dumps(visit_norfolk)
          assert int(visit_norfolk.get("eventCount") or 0) > 0, "VisitNorfolk returned no events"
          assert visit_norfolk.get("sourceUrl") == "https://www.visitnorfolk.com/events/"

          visit_hampton = next((source for source in sources if source.get("id") == "visit_hampton_official"), None)
          if require_visit_hampton:
              assert visit_hampton is not None, "Visit Hampton source is missing in production"
              assert visit_hampton.get("status") == "ok", json.dumps(visit_hampton)
              assert int(visit_hampton.get("eventCount") or 0) > 0, "Visit Hampton returned no events"
              assert visit_hampton.get("sourceUrl") == "https://visithampton.com/calendar/"

          print(json.dumps({
              "tourismKind": tourism,
              "visitNorfolk": visit_norfolk,
              "visitHampton": visit_hampton,
              "visitHamptonRequired": require_visit_hampton,
              "totalInstitutionEvents": (payload.get("summary") or {}).get("dedupedEvents"),
          }, indent=2))
          PY
      - name: Upload tourism smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-production-smoke-output
          path: tourism-production-smoke-output.json
          if-no-files-found: warn
          retention-days: 3
