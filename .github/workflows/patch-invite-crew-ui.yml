name: Patch Invite the Crew UI

on:
  push:
    branches: [feature/invite-the-crew]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invite-the-crew
          fetch-depth: 0
      - name: Add share actions and deep-link selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/buzz-map-app.tsx')
          text = path.read_text()

          old_icons = '''  Search,
            ShieldCheck,'''
          new_icons = '''  Search,
            Share2,
            Copy,
            MessageCircle,
            Download,
            ShieldCheck,'''
          if old_icons not in text:
              raise SystemExit('Icon import anchor not found')
          text = text.replace(old_icons, new_icons, 1)

          old_helper = 'import { getVenueLogo } from "../src/lib/venue-logo";'
          new_helper = '''import { getVenueLogo } from "../src/lib/venue-logo";
          import {
            buildInviteCrewText,
            buildInviteCrewUrl,
            buildStoryCardUrl,
          } from "../src/lib/invite-the-crew";'''
          if old_helper not in text:
              raise SystemExit('Share helper import anchor not found')
          text = text.replace(old_helper, new_helper, 1)

          old_state = '''  const [watchMessage, setWatchMessage] = useState("");
            const [reward, setReward]'''
          new_state = '''  const [watchMessage, setWatchMessage] = useState("");
            const [shareMessage, setShareMessage] = useState("");
            const [sharing, setSharing] = useState(false);
            const [reward, setReward]'''
          if old_state not in text:
              raise SystemExit('Share state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_ref = '''  const requestSequenceRef = useRef(0);
            const logoUrlsRef'''
          new_ref = '''  const requestSequenceRef = useRef(0);
            const deepLinkHandledRef = useRef(false);
            const logoUrlsRef'''
          if old_ref not in text:
              raise SystemExit('Deep link ref anchor not found')
          text = text.replace(old_ref, new_ref, 1)

          selection_anchor = '''  selectedRef.current = selectVenue;

            useEffect(() => {'''
          selection_replacement = '''  selectedRef.current = selectVenue;

            useEffect(() => {
              if (deepLinkHandledRef.current || !venues.length) return;
              const params = new URLSearchParams(window.location.search);
              const venueId = params.get("venue");
              if (!venueId || !venues.some(venue => String(venue.id) === venueId)) return;
              deepLinkHandledRef.current = true;
              selectVenue(venueId);
              if (params.get("invite") === "1") {
                setShareMessage("This place is ready to share. Tap Invite the Crew to open your phone’s share sheet.");
              }
            }, [venues, selectVenue]);

            useEffect(() => {'''
          if selection_anchor not in text:
              raise SystemExit('Deep link effect anchor not found')
          text = text.replace(selection_anchor, selection_replacement, 1)

          insert_at = text.index('  async function useMyLocation() {')
          share_functions = '''  function inviteVenue(venue: Venue) {
              return {
                id: venue.id,
                name: venue.name,
                city: venue.city || venue.area?.shortName || null,
                latitude: venue.lat,
                longitude: venue.lng,
                status: statusFor(venue),
                trend: venue.activity?.trendLabel || null,
                mode: venue.activity?.scoreMode || "forecast",
              };
            }

            async function copyInviteLink(venue: Venue) {
              const link = buildInviteCrewUrl(window.location.origin, inviteVenue(venue));
              try {
                await navigator.clipboard.writeText(link);
                setShareMessage("Invite link copied.");
              } catch {
                window.prompt("Copy this Buzz invite link", link);
                setShareMessage("Copy the link above and send it to the crew.");
              }
            }

            function textCrew(venue: Venue) {
              const details = inviteVenue(venue);
              const link = buildInviteCrewUrl(window.location.origin, details);
              const body = `${buildInviteCrewText(details)} ${link}`;
              window.location.href = `sms:?&body=${encodeURIComponent(body)}`;
              setShareMessage("Opening your messages app…");
            }

            async function storyCardFile(venue: Venue) {
              const details = inviteVenue(venue);
              const response = await fetch(buildStoryCardUrl(window.location.origin, details));
              if (!response.ok) throw new Error("Could not generate the Story card");
              const blob = await response.blob();
              const fileName = `buzz-${venue.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "venue"}.png`;
              return new File([blob], fileName, { type: "image/png" });
            }

            async function downloadStoryCard(venue: Venue) {
              setSharing(true);
              try {
                const file = await storyCardFile(venue);
                const objectUrl = URL.createObjectURL(file);
                const anchor = document.createElement("a");
                anchor.href = objectUrl;
                anchor.download = file.name;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(objectUrl);
                setShareMessage("Story graphic saved. Post it anywhere your crew hangs out.");
              } catch (shareError) {
                setShareMessage(shareError instanceof Error ? shareError.message : "Could not save the Story graphic");
              } finally {
                setSharing(false);
              }
            }

            async function shareWithCrew(venue: Venue) {
              const details = inviteVenue(venue);
              const link = buildInviteCrewUrl(window.location.origin, details);
              const text = buildInviteCrewText(details);
              setSharing(true);
              setShareMessage("Generating the crew card…");
              try {
                const file = await storyCardFile(venue);
                const canShareFile = typeof navigator.canShare === "function" && navigator.canShare({ files: [file] });
                if (typeof navigator.share === "function") {
                  await navigator.share({
                    title: `${venue.name} on Buzz`,
                    text,
                    url: link,
                    ...(canShareFile ? { files: [file] } : {}),
                  });
                  setShareMessage("Shared with the crew.");
                } else {
                  await copyInviteLink(venue);
                }
              } catch (shareError) {
                if (shareError instanceof DOMException && shareError.name === "AbortError") {
                  setShareMessage("");
                } else {
                  await copyInviteLink(venue);
                }
              } finally {
                setSharing(false);
              }
            }

          '''
          text = text[:insert_at] + share_functions + text[insert_at:]

          card_anchor = '''            <div className="buzz-detail-actions">'''
          invite_card = '''            <section className="buzz-invite-card">
              <header><div><small>FOMO MODE</small><strong>Bring the crew</strong><p>Share this venue’s surge—not your location—with one tap.</p></div><Share2 /></header>
              <button type="button" className="buzz-invite-primary" disabled={sharing} onClick={() => void shareWithCrew(selected)}><Share2 />{sharing ? "Building the Story card…" : "Invite the Crew"}</button>
              <div>
                <button type="button" onClick={() => void copyInviteLink(selected)}><Copy />Copy link</button>
                <button type="button" onClick={() => textCrew(selected)}><MessageCircle />Text crew</button>
                <button type="button" disabled={sharing} onClick={() => void downloadStoryCard(selected)}><Download />Save Story</button>
              </div>
              {shareMessage && <p>{shareMessage}</p>}
            </section>

            <div className="buzz-detail-actions">'''
          if card_anchor not in text:
              raise SystemExit('Invite card JSX anchor not found')
          text = text.replace(card_anchor, invite_card, 1)
          path.write_text(text)

          css = Path('app/buzz-map-app.css')
          css_text = css.read_text()
          css_anchor = '.buzz-detail-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}'
          css_insert = '''.buzz-invite-card{margin-top:13px;padding:14px;border:1px solid rgba(249,115,22,.55);border-radius:17px;background:linear-gradient(145deg,rgba(249,115,22,.16),rgba(139,92,246,.12))}.buzz-invite-card header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.buzz-invite-card header>svg{width:24px;color:#fb923c}.buzz-invite-card header small{display:block;color:#fb923c;font-size:7px;font-weight:950;letter-spacing:.14em}.buzz-invite-card header strong{display:block;margin-top:4px;font-size:14px}.buzz-invite-card header p{margin:4px 0 0;color:#aeb7c2;font-size:9px;line-height:1.4}.buzz-invite-primary{width:100%;height:44px;margin-top:13px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;background:#fff!important;color:#0b1016!important;font-size:10px!important;font-weight:950!important;cursor:pointer}.buzz-invite-primary svg{width:17px}.buzz-invite-primary:disabled,.buzz-invite-card>div button:disabled{opacity:.55;cursor:wait}.buzz-invite-card>div{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.buzz-invite-card>div button{height:36px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #3a4350;border-radius:11px;background:#121923;color:#fff;cursor:pointer;font-size:8px;font-weight:850}.buzz-invite-card>div button svg{width:13px}.buzz-invite-card>p{margin:9px 2px 0;color:#d6dce3;font-size:9px;line-height:1.4}
          ''' + css_anchor
          if css_anchor not in css_text:
              raise SystemExit('Invite CSS anchor not found')
          css.write_text(css_text.replace(css_anchor, css_insert, 1))
          PY
          rm .github/workflows/patch-invite-crew-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx app/buzz-map-app.css .github/workflows/patch-invite-crew-ui.yml
          git commit -m "Add Invite the Crew venue sharing"
          git push origin HEAD:feature/invite-the-crew