name: OpenStreetMap venue enrichment

on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-venue-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fill missing venue metadata from OpenStreetMap
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_URL:?Add BUZZ_PRODUCTION_URL as a GitHub Actions secret}"
          : "${CRON_SECRET:?Add CRON_SECRET as a GitHub Actions secret}"
          BASE_URL="${BASE_URL%/}"
          curl --silent --show-error --fail-with-body --retry 2 --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/venues/osm-enrich?limit=350"
