name: Patch venue listing parser

on:
  push:
    branches: [chore/institution-production-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/institution-production-gate
          fetch-depth: 0
      - name: Wire listing fallback into institution provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/events/institution-calendars.ts')
          text = path.read_text()
          import_anchor = '} from "./city-calendars";\n'
          import_line = 'import { parseVenueListingEvents } from "./venue-listing";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old_listing = '  const listingEvents = parseCityCalendarJsonLd(listing, sourceAdapter(source));\n  const links = extractInstitutionDetailLinks(listing, source);'
          new_listing = '  const listingEvents = parseCityCalendarJsonLd(listing, sourceAdapter(source));\n  const listingFallbackEvents = parseVenueListingEvents(listing, source);\n  const links = extractInstitutionDetailLinks(listing, source);'
          if old_listing in text:
              text = text.replace(old_listing, new_listing, 1)
          elif 'const listingFallbackEvents = parseVenueListingEvents(listing, source);' not in text:
              raise SystemExit('Listing anchor not found')
          old_events = '  const events = [...listingEvents, ...detailEvents];'
          new_events = '  const events = [...listingEvents, ...listingFallbackEvents, ...detailEvents];'
          if old_events in text:
              text = text.replace(old_events, new_events, 1)
          elif new_events not in text:
              raise SystemExit('Event merge anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/institution-calendars.ts
          git commit -m "Parse official venue listing dates"
          git push origin HEAD:chore/institution-production-gate
