name: Apply elite UI now once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-elite-ui-now-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/elite-live-activity-ui-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/apply.py').write_text(textwrap.dedent(source[start:end]), encoding='utf-8')
          PY
          python /tmp/apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx app/buzz-map-app.css
          git commit -m "Rebuild Buzz around live city activity"
          git pull --rebase origin main
          git push origin main
