name: Fix mobile map stale venue ref

on:
  push:
    paths:
      - .github/workflows/fix-mobile-map-stale-venue-ref.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale Mapbox venue lookup
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/mobile-home.tsx")
          text = path.read_text()

          text = text.replace(
              '  const mapRef=useRef<mapboxgl.Map|null>(null);',
              '  const mapRef=useRef<mapboxgl.Map|null>(null);\n  const mappedRef=useRef<Venue[]>([]);'
          )

          text = text.replace(
              '  const mapped=useMemo(()=>filtered.filter(validVenue),[filtered]);',
              '  const mapped=useMemo(()=>filtered.filter(validVenue),[filtered]);\n  mappedRef.current=mapped;'
          )

          old = 'const venue=mapped.find(item=>String(item.id)===venueId);'
          new = 'const venue=mappedRef.current.find(item=>String(item.id)===venueId);'

          if old not in text:
              raise SystemExit("Expected stale mapped lookup was not found")

          path.write_text(text.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile-home.tsx
          git commit -m "fix: use current venues when tapping map dots"
          git push
