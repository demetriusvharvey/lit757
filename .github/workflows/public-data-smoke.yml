name: Public data smoke

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production public-data APIs
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_URL:?Add BUZZ_PRODUCTION_URL as a GitHub Actions secret}"
          BASE_URL="${BASE_URL%/}"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          report = {}

          def save_report():
              with open("public-data-smoke-output.json", "w", encoding="utf-8") as output:
                  json.dump(report, output, indent=2)

          def get(path, timeout=45):
              url = f"{base}{path}"
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "BuzzPublicDataSmoke/1.0", "Accept": "application/json"},
              )
              try:
                  response = urllib.request.urlopen(request, timeout=timeout)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  report[path] = {"httpStatus": error.code, "body": body[:20000]}
                  save_report()
                  raise AssertionError(f"{path} returned HTTP {error.code}: {body[:4000]}") from error
              except Exception as error:
                  report[path] = {"requestError": str(error)}
                  save_report()
                  raise AssertionError(f"{path} request failed: {error}") from error
              with response:
                  payload = json.load(response)
                  report[path] = payload
                  save_report()
                  if response.status != 200:
                      raise AssertionError(f"{path} returned HTTP {response.status}: {payload}")
                  if payload.get("success") is not True:
                      raise AssertionError(f"{path} failed: {json.dumps(payload)[:4000]}")
                  return payload

          weather = get("/api/data/weather?city=Virginia%20Beach")
          assert weather.get("provider") == "National Weather Service"
          assert len(weather.get("forecast") or []) > 0, "NWS daily forecast is empty"
          assert len(weather.get("hourly") or []) > 0, "NWS hourly forecast is empty"
          assert isinstance(weather.get("alerts"), list), "NWS alerts must be a list"
          assert weather.get("activityImpact", {}).get("level"), "Weather impact is missing"

          static = get("/api/data/transit/static", timeout=60)
          assert static.get("provider") == "Hampton Roads Transit"
          assert int(static.get("routeCount") or 0) > 0, "HRT route count is zero"
          assert int(static.get("stopCount") or 0) > 0, "HRT stop count is zero"
          assert len(static.get("routes") or []) == int(static["routeCount"])
          assert len(static.get("stops") or []) == int(static["stopCount"])

          realtime = get("/api/data/transit/realtime")
          assert realtime.get("provider") == "Hampton Roads Transit"
          availability = realtime.get("availability") or {}
          assert availability.get("tripUpdates") is True, "HRT trip updates are unavailable"
          assert availability.get("alerts") is True, "HRT alerts are unavailable"
          assert isinstance(realtime.get("tripUpdates"), list)
          assert isinstance(realtime.get("alerts"), list)
          assert isinstance(realtime.get("vehicles"), list)

          calendars = get("/api/data/city-calendars", timeout=120)
          expected_cities = {
              "Norfolk", "Chesapeake", "Portsmouth", "Hampton", "Newport News", "Suffolk"
          }
          city_health = calendars.get("cityHealth") or {}
          assert expected_cities.issubset(set(city_health)), "One or more city calendar registries are missing"
          for city in expected_cities:
              assert int(city_health[city].get("successfulFeeds") or 0) > 0, f"{city} has no working official calendar feed"

          institutions = get("/api/data/institution-calendars", timeout=180)
          institution_summary = institutions.get("summary") or {}
          institution_kinds = institutions.get("byKind") or {}
          institution_failures = [
              source for source in institutions.get("sources", []) if source.get("status") != "ok"
          ]
          print("Institution source health:", json.dumps(institutions.get("sources") or [], indent=2), flush=True)
          assert int(institution_summary.get("dedupedEvents") or 0) > 0, "Institution calendars returned no events"
          assert int((institution_kinds.get("university") or {}).get("successful") or 0) > 0, "No university calendar is working"
          assert (
              int((institution_kinds.get("arena") or {}).get("successful") or 0)
              + int((institution_kinds.get("arts") or {}).get("successful") or 0)
          ) > 0, "No arena or arts-center calendar is working"
          assert (
              int((institution_kinds.get("museum") or {}).get("successful") or 0)
              + int((institution_kinds.get("festival") or {}).get("successful") or 0)
              + int((institution_kinds.get("attraction") or {}).get("successful") or 0)
          ) > 0, "No museum, festival, or attraction calendar is working"

          print(json.dumps({
              "weatherPeriods": len(weather["hourly"]),
              "weatherAlerts": len(weather["alerts"]),
              "hrtRoutes": static["routeCount"],
              "hrtStops": static["stopCount"],
              "hrtTripUpdates": len(realtime["tripUpdates"]),
              "hrtAlerts": len(realtime["alerts"]),
              "hrtVehicles": len(realtime["vehicles"]),
              "vehiclePositionsAvailable": availability.get("vehiclePositions"),
              "calendarFeeds": calendars.get("summary", {}).get("registeredFeeds"),
              "calendarFeedsWorking": calendars.get("summary", {}).get("successfulFeeds"),
              "calendarEvents": calendars.get("summary", {}).get("dedupedEvents"),
              "calendarCities": city_health,
              "institutionSources": institution_summary.get("registeredSources"),
              "institutionSourcesWorking": institution_summary.get("successfulSources"),
              "institutionEvents": institution_summary.get("dedupedEvents"),
              "institutionKinds": institution_kinds,
              "institutionFailures": institution_failures,
          }, indent=2))
          PY
      - name: Upload public-data smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-data-smoke-output
          path: public-data-smoke-output.json
          if-no-files-found: warn
          retention-days: 3
