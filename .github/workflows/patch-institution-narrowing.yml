name: Patch institution narrowing

on:
  push:
    branches: [feature/institution-calendars]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/institution-calendars
          fetch-depth: 0
      - name: Replace nullable array chain with explicit narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/events/institution-calendars.ts')
          text = path.read_text()
          old = '    events.push(...rows.map(row => tribeEvent(source, row)).filter((event): event is NormalizedCityEvent => Boolean(event)));'
          new = '''    for (const row of rows) {
              const event = tribeEvent(source, row);
              if (event) events.push(event);
            }'''
          if old not in text:
              raise SystemExit('Target narrowing expression not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/institution-calendars.ts
          git commit -m "Narrow nullable Tribe events explicitly"
          git push origin HEAD:feature/institution-calendars
