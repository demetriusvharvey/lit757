name: Patch Visit Hampton tourism source

on:
  push:
    branches: [feature/visit-hampton-tourism]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visit-hampton-tourism
          fetch-depth: 0
      - name: Register official Visit Hampton calendar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/events/institution-calendars.ts")
          text = path.read_text()
          if 'id: "visit_hampton_official"' in text:
              raise SystemExit(0)

          visit_norfolk = text.index('    id: "visit_norfolk_official"')
          insertion_point = text.index('  },\n];', visit_norfolk) + len('  },\n')
          block = "\n".join([
              '  {',
              '    id: "visit_hampton_official",',
              '    name: "Visit Hampton Events",',
              '    kind: "tourism",',
              '    city: "Hampton",',
              '    url: "https://visithampton.com/calendar/",',
              '    format: "tribe-api",',
              '    enabled: true,',
              '    coverageNote: "Official Hampton destination calendar with festivals, waterfront events, arts, sports, tours, food, and community programming.",',
              '  },',
              '',
          ])
          path.write_text(text[:insertion_point] + block + text[insertion_point:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events/institution-calendars.ts
          git commit -m "Add Visit Hampton official tourism calendar"
          git push origin HEAD:feature/visit-hampton-tourism
