name: BestTime existing forecast recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/besttime-existing-forecast-recovery-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and recover BestTime account forecasts without creating any
        env:
          BASE_URL: ${{ secrets.BUZZ_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export RUN_URL

          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            printf '## BestTime read-only recovery failed\n\nRequired GitHub production secrets are missing.\n\n[Open workflow run](%s)\n' "$RUN_URL" > besttime-recovery-summary.md
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error --max-time 240 \
            --output besttime-recovery.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/buzz/besttime-recover?limit=25")
          CURL_STATUS=$?
          export HTTP_STATUS CURL_STATUS

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_url = os.environ.get("RUN_URL", "")
          http_status = os.environ.get("HTTP_STATUS", "unknown")
          curl_status = int(os.environ.get("CURL_STATUS", "1"))
          payload_path = Path("besttime-recovery.json")
          payload = None
          parse_error = None

          if payload_path.exists():
              try:
                  payload = json.loads(payload_path.read_text(encoding="utf-8"))
              except Exception as error:
                  parse_error = str(error)

          failure = None
          if curl_status != 0:
              failure = f"The protected production endpoint could not be reached (curl status {curl_status})."
          elif http_status != "200":
              failure = f"The protected production endpoint returned HTTP {http_status}."
          elif parse_error:
              failure = f"The production response was not valid JSON: {parse_error}"
          elif not isinstance(payload, dict) or payload.get("success") is not True:
              failure = f"The production endpoint reported failure: {str((payload or {}).get('error') or 'unknown error')[:500]}"

          if failure:
              lines = [
                  "## BestTime read-only recovery failed",
                  "",
                  failure,
                  "",
                  "No new BestTime forecast was created by this run.",
                  "",
                  f"[Open workflow run]({run_url})",
              ]
              Path("besttime-recovery-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(1)

          account_count = int(payload.get("accountVenueCount") or 0)
          account_forecasted = int(payload.get("accountForecastedCount") or 0)
          candidate_count = int(payload.get("candidateCount") or 0)
          recovered = int(payload.get("recovered") or 0)
          mapped_without_forecast = int(payload.get("mappedWithoutForecast") or 0)
          unsupported = int(payload.get("unsupported") or 0)
          not_in_account = int(payload.get("notInAccount") or 0)
          failed = int(payload.get("failed") or 0)

          lines = [
              "## BestTime read-only recovery completed",
              "",
              f"- BestTime account venues returned: **{account_count}**",
              f"- Account venues with forecasts: **{account_forecasted}**",
              f"- Buzz candidates inspected: **{candidate_count}**",
              f"- Forecast evidence recovered: **{recovered}**",
              f"- Provider mappings saved without a current forecast: **{mapped_without_forecast}**",
              f"- Unsupported by BestTime: **{unsupported}**",
              f"- Not found in the BestTime account: **{not_in_account}**",
              f"- Database failures: **{failed}**",
              "",
              "This recovery was read-only at BestTime: it did not create or refresh a forecast and could not consume forecast credits.",
              "",
              f"[Open workflow run]({run_url})",
          ]
          Path("besttime-recovery-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps({
              "accountVenueCount": account_count,
              "accountForecastedCount": account_forecasted,
              "candidateCount": candidate_count,
              "recovered": recovered,
              "mappedWithoutForecast": mapped_without_forecast,
              "unsupported": unsupported,
              "notInAccount": not_in_account,
              "failed": failed,
          }, indent=2))
          PY

      - name: Record recovery result on integration issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f besttime-recovery-summary.md ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '## BestTime read-only recovery failed\n\nThe workflow stopped before producing a summary.\n\n[Open workflow run](%s)\n' "$RUN_URL" > besttime-recovery-summary.md
          fi
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body-file besttime-recovery-summary.md

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: besttime-read-only-recovery-${{ github.run_id }}
          path: |
            besttime-recovery.json
            besttime-recovery-summary.md
          if-no-files-found: warn
          retention-days: 7
