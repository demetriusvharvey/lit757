name: Apply adaptive map patch

on:
  push:
    branches: [feature/adaptive-map-heat-hubs]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-map-heat-hubs
          fetch-depth: 0
      - name: Apply adaptive discovery transformation
        run: python scripts/apply-adaptive-map-patch.py
      - name: Commit transformed UI
        shell: bash
        run: |
          rm .github/workflows/patch-adaptive-map.yml scripts/apply-adaptive-map-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/buzz-map-app.tsx app/buzz-map-app.css .github/workflows/patch-adaptive-map.yml scripts/apply-adaptive-map-patch.py
          git commit -m "Build adaptive day-night discovery and Heat Hubs"
          git push origin HEAD:feature/adaptive-map-heat-hubs
